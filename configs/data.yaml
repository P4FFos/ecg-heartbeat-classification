dataset:
  name: mit-bih-arrhythmia
  version: "1.0.0"
  source: https://physionet.org/content/mitdb/1.0.0/
  raw_dir: data/mit-bih-arrhythmia-database-1.0.0
  processed_dir: data/processed
  fs_hz: 360
  lead: MLII

records:
  # Excluded in full: contain paced beats (AAMI EC57)
  excluded: ["102", "104", "107", "217"]

  # DS1 internal split, by record
  train:
    [
      "101",
      "106",
      "108",
      "109",
      "112",
      "115",
      "116",
      "118",
      "122",
      "201",
      "203",
      "207",
      "208",
      "209",
      "215",
      "230",
    ]
  val: ["114", "119", "124", "205", "220", "223"]

  # DS2 is the evaluation dataset
  test:
    [
      "100",
      "103",
      "105",
      "111",
      "113",
      "117",
      "121",
      "123",
      "200",
      "202",
      "210",
      "212",
      "213",
      "214",
      "219",
      "221",
      "222",
      "228",
      "231",
      "232",
      "233",
      "234",
    ]

labels:
  classes: ["N", "S", "V", "F"]
  aami_map:
    N: N
    L: N
    R: N
    e: N
    j: N
    A: S
    a: S
    J: S
    S: S
    V: V
    E: V
    F: F
    "/": Q
    f: Q
    Q: Q
  drop_classes: ["Q"]

beats:
  # Window around the annotated R-peak, in samples at 360 Hz
  samples_before: 100
  samples_after: 100
  input_length: 200

preprocessing:
  # Applied to the full record, before segmentation
  bandpass:
    enabled: true
    low_hz: 0.5
    high_hz: 40.0
    order: 3
  normalization:
    method: per_record_zscore # per_record_zscore | per_beat_minmax | none
  clipping:
    enabled: true
    limit_sigma: 12.0

augmentation:
  # Training split only
  enabled: false

reproducibility:
  seed: 42
